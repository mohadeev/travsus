<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			@import url('https://fonts.cdnfonts.com/css/sf-pro-display');

			.container {
				width: 100%;
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				background-image: url('https://res.cloudinary.com/travsus/image/upload/v1733090030/mejor-agencia-para-viajar-a-marruecos.jpg_o2n7pl.png');
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
			}

			.text {
				font-family:
					'SF Pro Display',
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				font-size: 6vw;
				font-weight: 900;
				text-align: center;
				padding: 20px;
				background: rgba(255, 255, 255, 0.7);
				border-radius: 15px;
				backdrop-filter: blur(5px);
				max-width: 90%;
				line-height: 1.2;
				letter-spacing: 2px;
				text-transform: uppercase;
				color: black;
				text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
			}

			.text span {
				display: block;
				font-size: 4vw;
				margin-top: 10px;
				font-weight: 300;
				color: black;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1 class="text">
				Welcome to Morocco
				<span>Experience the Magic</span>
			</h1>
		</div>
	</body>
</html>

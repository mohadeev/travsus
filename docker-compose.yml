services:
  travsus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COMPANY_PROFILE: ${NEXT_PUBLIC_COMPANY_PROFILE}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    container_name: travsus
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
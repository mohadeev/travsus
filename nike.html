<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Designer Platform</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				background-color: #fff;
			}

			.navbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 1rem 2rem;
				border-bottom: 1px solid #e5e5e5;
			}

			.nav-links {
				display: flex;
				gap: 2rem;
			}

			.nav-links a {
				text-decoration: none;
				color: #333;
				font-size: 0.9rem;
			}

			.auth-buttons {
				display: flex;
				gap: 1rem;
			}

			.btn {
				padding: 0.5rem 1rem;
				border-radius: 8px;
				font-size: 0.9rem;
				cursor: pointer;
			}

			.btn-primary {
				background-color: #0d0c22;
				color: white;
				border: none;
			}

			.btn-secondary {
				background-color: transparent;
				color: #0d0c22;
				border: none;
			}

			.hero {
				text-align: center;
				padding: 4rem 1rem;
				max-width: 800px;
				margin: 0 auto;
			}

			.hero h1 {
				font-family: 'Playfair Display', serif;
				font-size: 3.5rem;
				color: #0d0c22;
				margin-bottom: 1rem;
				line-height: 1.2;
			}

			.hero p {
				color: #6e6d7a;
				font-size: 1.1rem;
				margin-bottom: 2rem;
			}

			.search-container {
				position: relative;
				max-width: 600px;
				margin: 0 auto;
			}

			.search-bar {
				width: 100%;
				padding: 1rem;
				padding-right: 120px;
				border: 1px solid #e5e5e5;
				border-radius: 8px;
				font-size: 1rem;
				background-color: #f8f7f4;
			}

			.search-filter {
				position: absolute;
				right: 60px;
				top: 50%;
				transform: translateY(-50%);
				padding: 0.5rem;
				border: none;
				background: transparent;
				color: #6e6d7a;
				cursor: pointer;
			}

			.search-button {
				position: absolute;
				right: 8px;
				top: 50%;
				transform: translateY(-50%);
				background-color: #ea4c89;
				color: white;
				border: none;
				padding: 0.5rem;
				border-radius: 6px;
				cursor: pointer;
			}

			.trending {
				display: flex;
				gap: 1rem;
				justify-content: center;
				margin-top: 1.5rem;
			}

			.trending span {
				color: #6e6d7a;
				font-size: 0.9rem;
			}

			.trending a {
				color: #0d0c22;
				text-decoration: none;
				font-size: 0.9rem;
				padding: 0.5rem 1rem;
				background-color: #f8f7f4;
				border-radius: 8px;
			}
		</style>
	</head>
	<body>
		<nav class="navbar">
			<div class="nav-links">
				<a href="#">Explore</a>
				<a href="#">Hire a Designer</a>
				<a href="#">Find Jobs</a>
				<a href="#">Blog</a>
			</div>
			<div class="auth-buttons">
				<button class="btn btn-secondary">Sign up</button>
				<button class="btn btn-primary">Log in</button>
			</div>
		</nav>

		<section class="hero">
			<h1>Discover the world's<br />top designers</h1>
			<p>
				Explore work from the most talented and accomplished designers<br />ready
				to take on your next project
			</p>

			<div class="search-container">
				<input
					type="text"
					class="search-bar"
					placeholder="What are you looking for?"
				/>
				<button class="search-filter">Shots ▼</button>
				<button class="search-button">
					<svg
						width="16"
						height="16"
						viewBox="0 0 16 16"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
					>
						<path
							d="M15.8898 14.6524L12.0963 10.8588C13.0246 9.71855 13.5714 8.27331 13.5714 6.78571C13.5714 3.04457 10.5268 0 6.78571 0C3.04457 0 0 3.04457 0 6.78571C0 10.5268 3.04457 13.5714 6.78571 13.5714C8.27331 13.5714 9.71855 13.0246 10.8588 12.0963L14.6524 15.8898C14.8893 16.1267 15.2755 16.1267 15.5124 15.8898L15.8898 15.5124C16.1267 15.2755 16.1267 14.8893 15.8898 14.6524ZM6.78571 12C3.91331 12 1.57143 9.65812 1.57143 6.78571C1.57143 3.91331 3.91331 1.57143 6.78571 1.57143C9.65812 1.57143 12 3.91331 12 6.78571C12 9.65812 9.65812 12 6.78571 12Z"
							fill="white"
						/>
					</svg>
				</button>
			</div>

			<div class="trending">
				<span>Trending searches:</span>
				<a href="#">landing page</a>
				<a href="#">e-commerce</a>
				<a href="#">mobile app</a>
				<a href="#">logo design</a>
				<a href="#">dashboard</a>
			</div>
		</section>
	</body>
</html>
